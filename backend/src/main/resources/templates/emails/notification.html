<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DocuSphere Notification</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f4f5; padding: 40px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);">
                <tr>
                    <td style="background-color: #18181b; padding: 25px; text-align: center;">
                        <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 700;">DocuSphere</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 35px;">
                        <h2 style="margin-top: 0; color: #18181b; font-size: 18px; font-weight: 600;" th:text="${title}">Notification Title</h2>
                        <p style="color: #52525b; font-size: 15px; line-height: 1.6;" th:text="${message}">Notification message body.</p>

                        <div th:if="${actionUrl}" style="margin-top: 25px;">
                            <a th:href="${actionUrl}" style="display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500;">
                                View Details
                            </a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="background-color: #fafafa; padding: 18px; text-align: center; border-top: 1px solid #e4e4e7;">
                        <p style="margin: 0; color: #a1a1aa; font-size: 12px;">
                            You are receiving this email because of your DocuSphere account settings.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
