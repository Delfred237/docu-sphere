spring:
  # H2 in-memory database for local testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

  # Disable Flyway for tests (H2 uses Hibernate auto-DDL)
  flyway:
    enabled: false

  # Mail configuration (disabled in tests)
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

# Application configuration for tests
app:
  security:
    jwt-secret: test-secret-key-for-tests-only-minimum-256-bits-long-for-security
    jwt-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  admin:
    email: admin@test.com
    password: Admin123!
    first-name: Test
    last-name: Admin

  storage:
    location: ./target/test-storage
    allowed-mime-types:
      - application/pdf
      - image/jpeg
      - image/png
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/msword
    max-file-size: 52428800

management:
  health:
    # Disable all custom health indicators in tests
    defaults:
      enabled: true
    mail:
      enabled: false
    db:
      enabled: true
    diskspace:
      enabled: false
  endpoint:
    health:
      # Show only status, not details
      show-details: never
      # Return 200 even if some components are down
      status:
        http-mapping:
          down: 200
          out-of-service: 200