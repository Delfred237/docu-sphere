services:
  postgres:
    image: postgres:16-alpine
    container_name: docusphere_postgres
    environment:
      POSTGRES_USER: docusphere
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docusphere
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docusphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: docusphere_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI Web
    restart: unless-stopped

volumes:
  postgres_data: