services:
  postgres:
    image: postgres:16-alpine
    container_name: docusphere_postgres
    environment:
      POSTGRES_USER: docusphere
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docusphere
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U docusphere" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docusphere-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: docusphere_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI Web
    networks:
      - docusphere-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docusphere-backend
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: dev

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docusphere
      SPRING_DATASOURCE_USERNAME: docusphere
      SPRING_DATASOURCE_PASSWORD: password

      # JWT
      APP_SECURITY_JWT_SECRET: docusphere_super_secret_key_for_dev_only_change_in_prod_1234567890
      APP_SECURITY_JWT_EXPIRATION_MS: 900000
      APP_SECURITY_REFRESH_TOKEN_EXPIRATION_MS: 604800000

      # Admin user
      APP_ADMIN_EMAIL: admin@docusphere.com
      APP_ADMIN_PASSWORD: Admin123!
      APP_ADMIN_FIRST_NAME: System
      APP_ADMIN_LAST_NAME: Administrator

      # Manager user
      APP_MANAGER_EMAIL: manager@docusphere.com
      APP_MANAGER_PASSWORD: Manager123!
      APP_MANAGER_FIRST_NAME: System
      APP_MANAGER_LAST_NAME: Manager

      # Mail (Mailpit)
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025

      # Storage
      APP_STORAGE_LOCATION: /app/storage
    volumes:
      - ./backend/storage-dev:/app/storage
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - docusphere-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  docusphere-network:
    driver: bridge